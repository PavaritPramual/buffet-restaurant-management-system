spring:
  datasource:
    url: jdbc:h2:mem:buffet_demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/h2
    default-schema: public
    schemas: public
    validate-on-migrate: true

app:
  menu:
    admin-access-provider: fixture
  ordering:
    session-provider: fixture
  dining-session:
    staff-access-provider: session
  fulfillment:
    access-provider: fixture
  seed:
    enabled: true
  billing:
    context-provider: database
  payment:
    status-provider: database
