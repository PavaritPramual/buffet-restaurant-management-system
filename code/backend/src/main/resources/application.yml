spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: buffet-restaurant-backend
  jackson:
    mapper:
      accept-case-insensitive-enums: false
  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration/common,classpath:db/migration/postgresql
    default-schema: public
    schemas: public
    validate-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}

app:
  ordering:
    # Production-safe default. Use the local profile only for the development fixture.
    session-provider: ${ORDERING_SESSION_PROVIDER:disabled}
