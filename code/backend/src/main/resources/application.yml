spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: buffet-restaurant-backend
  jackson:
    mapper:
      accept-case-insensitive-enums: false
  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration/common,classpath:db/migration/postgresql
    default-schema: public
    schemas: public
    validate-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}

app:
  master-data:
    access-provider: ${MASTER_DATA_ACCESS_PROVIDER:session}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:Restaurant Manager}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:Restaurant}
    last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:Manager}
  menu:
    admin-access-provider: ${MENU_ADMIN_ACCESS_PROVIDER:session}
  ordering:
    # Validate the customer cookie and active DiningSession from the database by default.
    session-provider: ${ORDERING_SESSION_PROVIDER:database}
  dining-session:
    staff-access-provider: ${DINING_SESSION_STAFF_ACCESS_PROVIDER:disabled}
  fulfillment:
    # Compose enables the session provider; standalone runtime must opt in explicitly.
    access-provider: ${FULFILLMENT_ACCESS_PROVIDER:disabled}
  billing:
    context-provider: ${BILLING_CONTEXT_PROVIDER:disabled}
  payment:
    status-provider: ${PAYMENT_STATUS_PROVIDER:disabled}
