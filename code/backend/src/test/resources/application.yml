spring:
  profiles:
    active: test
  application:
    name: buffet-restaurant-backend
  jackson:
    mapper:
      accept-case-insensitive-enums: false
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/h2
    default-schema: public
    schemas: public
    validate-on-migrate: true

app:
  menu:
    admin-access-provider: fixture
  ordering:
    session-provider: fixture
